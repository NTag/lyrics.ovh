# Stack ovhlyrics on three.ntag.fr, deployed by the deploy gateway from
# .github/workflows/deploy.yml: api.lyrics.ovh (8080) and lyrics.ovh (8081).
# One of the busiest services on the server, and each API request scrapes
# lyrics sites: the limits below are what keeps it from draining the server
# (Docker's daemon caps logs at 5 × 20 MB per container). Healthcheck in the
# Dockerfile.
services:
  backend:
    image: docker.ntag.fr/ovhlyrics:latest
    environment:
      # These sites block three.ntag.fr's (datacenter) IP address; they still
      # work from other networks, so the code keeps them.
      LYRICS_DISABLED_SOURCES: genius,azlyrics,lyricsmania,letras,lyricscom
      # Per-source outcomes (found, miss, http429, timeout…) logged every minute.
      LYRICS_LOG_SOURCES: "1"
    ports:
      - "20050:8080"
      - "20051:8081"
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 30s
        order: start-first
      resources:
        limits:
          memory: 500M
          cpus: "1"
