# .github/workflows/deploy.yml — keep this file name: the deploy gateway only
# accepts tokens from it (job_workflow_ref …/deploy.yml@refs/heads/main).
#
# Builds the image, then sends the stack file to the gateway with the run's
# OIDC token. No SSH key, no Docker access: the gateway checks the file,
# pins images to digests, runs the app's migration (if apps.yaml has one) and
# rolls out. The only secret is REGISTRY_PASSWORD (the app's Zot account).
#
# Several images, each rebuilt only when its files change: see KinoNow's
# .github/workflows/deploy.yml.
name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

# The GITHUB_TOKEN can read the repo and nothing else.
permissions:
  contents: read

# One run at a time; a second push waits instead of being refused (409).
concurrency:
  group: deploy-ovhlyrics
  cancel-in-progress: false

# Actions are pinned to a full commit SHA (tag in the comment for humans).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.ntag.fr
          username: ovhlyrics
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: docker.ntag.fr/ovhlyrics:latest

  # The only job that may mint an OIDC token; it runs no project code.
  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Deploy through deploy.ntag.fr
        # berghain style: put the values of the compose file's ${VAR}s here,
        # `docker stack config` interpolates them.
        # env:
        #   SOME_SECRET: "…"
        run: |
          docker stack config -c docker-compose.prod.yml > stack.yml
          TOKEN=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://deploy.ntag.fr" | jq -r .value)
          echo "::add-mask::$TOKEN"
          curl --fail-with-body -sS --max-time 1300 \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/yaml" \
            --data-binary @stack.yml https://deploy.ntag.fr/v1/deploy
